name: end-to-end

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix app ci
      - run: npm run build
      - name: Select the Chromium browser for end-to-end tests
        shell: pwsh
        run: |
          if ($IsLinux) {
            # The Ubuntu image configures its user-namespace sandbox for the installed Chrome.
            $browser = '/usr/bin/google-chrome'
          } else {
            $browserDir = Join-Path $env:RUNNER_TEMP 'baton-browser'
            $browser = npx --yes '@puppeteer/browsers@3.2.7' install 'chrome-headless-shell@158.0.8127.36' --path $browserDir --format '{{path}}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $browser --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BATON_E2E_BROWSER=$browser" >> $env:GITHUB_ENV
      - name: Run end-to-end tests against the npm package
        shell: pwsh
        run: |
          $archive = npm pack --silent --ignore-scripts --pack-destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directory = Join-Path $env:RUNNER_TEMP ('baton-e2e-' + [guid]::NewGuid())
          $null = New-Item -ItemType Directory -Path $directory
          tar -xzf (Join-Path $env:RUNNER_TEMP $archive) -C $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BATON_E2E_ROOT = Join-Path $directory 'package'
          npm run test:e2e
          exit $LASTEXITCODE
