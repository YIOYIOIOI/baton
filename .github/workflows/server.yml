# Server lint, typecheck, cross-platform tests, and OSS cleanliness gate.
name: server

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'sidecars/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'sidecars/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run oss:check
