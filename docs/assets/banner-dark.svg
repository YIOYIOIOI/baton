<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Baton — Local-First Remote Continuity for AI Coding Agents">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16171B"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <radialGradient id="sphere-dark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6B8CFF"/>
      <stop offset="65%" stop-color="#3B6BFF"/>
      <stop offset="100%" stop-color="#2455FF"/>
    </radialGradient>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg-dark)"/>
  <rect width="1200" height="260" rx="20" fill="url(#grid-dark)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="19.5" fill="none" stroke="rgba(255,255,255,0.11)"/>

  <!-- Geometric arch + cobalt sphere icon -->
  <g transform="translate(86, 56)">
    <rect x="0" y="0" width="148" height="148" rx="34" fill="#1E2026" stroke="rgba(255,255,255,0.12)"/>
    <path d="M 38 118 V 68 C 38 43 55 26 77 26 C 99 26 114 43 114 68 V 77 C 107 72 99 69 90 69 V 68 C 90 55 84 48 76 48 C 68 48 61 55 61 68 V 100 L 89 110 C 89 113 90 116 92 118 Z" fill="#F2F2F4"/>
    <circle cx="95" cy="94" r="24" fill="url(#sphere-dark)" stroke="#1E2026" stroke-width="3.5"/>
  </g>

  <!-- Wordmark: bat●n -->
  <g transform="translate(268, 118)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F5F5F7">bat</text>
    <circle cx="144" cy="-23" r="19" fill="url(#sphere-dark)"/>
    <text x="171" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F5F5F7">n</text>

    <text x="2" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.1" fill="#A6AAB4">
      Local-first remote continuity for AI coding agents
    </text>
    <text x="2" y="66" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="500" fill="#7D8290">
      Claude Code  ·  OpenAI Codex  ·  Gemini Antigravity
    </text>
  </g>

  <!-- Editorial telemetry pills on right -->
  <g transform="translate(888, 72)" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="248" height="32" rx="8" fill="#1D1F25" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="18" cy="16" r="4.5" fill="#34D399"/>
    <text x="32" y="20" fill="#ECEDF0">0 Runtime Dependencies</text>

    <rect x="0" y="42" width="248" height="32" rx="8" fill="#1D1F25" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="18" cy="58" r="4.5" fill="#5A84FF"/>
    <text x="32" y="62" fill="#ECEDF0">Node >= 24 · SSE · SQLite</text>

    <rect x="0" y="84" width="248" height="32" rx="8" fill="#1D1F25" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="18" cy="100" r="4.5" fill="#E4E5E9"/>
    <text x="32" y="104" fill="#ECEDF0">Zero Cloud Relay · MIT</text>
  </g>
</svg>
